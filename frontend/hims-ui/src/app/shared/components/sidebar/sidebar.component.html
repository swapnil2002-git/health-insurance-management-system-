<div class="sidebar-container">
  <div class="sidebar-headline">
    <span>HIMS MODULES</span>
  </div>

  <nav class="nav-list">
    <ng-container *ngFor="let item of navItems">
      <!-- Direct route item (e.g. Dashboard) -->
      <a
        *ngIf="!item.submenus"
        [routerLink]="item.route"
        routerLinkActive="active-nav-item"
        class="nav-item"
      >
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.title }}</span>
      </a>

      <!-- Parent item with expandable submenus -->
      <div *ngIf="item.submenus" class="nav-group" [class.group-active]="isSubmenuActive(item)">
        <button
          type="button"
          class="nav-item nav-parent"
          (click)="toggleExpand(item)"
          [attr.aria-expanded]="item.expanded"
        >
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
          <span class="nav-label">{{ item.title }}</span>
          <mat-icon class="expand-icon">
            {{ item.expanded ? 'expand_less' : 'expand_more' }}
          </mat-icon>
        </button>

        <!-- Submenu items -->
        <div class="submenu-container" *ngIf="item.expanded">
          <a
            *ngFor="let sub of item.submenus"
            [routerLink]="sub.route"
            routerLinkActive="active-sub-item"
            class="submenu-item"
          >
            <span class="sub-dot"></span>
            <span class="sub-label">{{ sub.title }}</span>
          </a>
        </div>
      </div>
    </ng-container>
  </nav>

  <div class="sidebar-footer">
    <div class="role-pill">
      <mat-icon class="role-icon">verified</mat-icon>
      <span>{{ userRole }}</span>
    </div>
  </div>
</div>
