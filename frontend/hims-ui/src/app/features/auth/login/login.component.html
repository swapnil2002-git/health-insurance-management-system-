<div class="login-container">
  <mat-card class="login-card mat-elevation-z8">
    <div class="card-header">
      <div class="logo-circle">
        <mat-icon class="shield-icon">health_and_safety</mat-icon>
      </div>
      <h2>HIMS Enterprise</h2>
      <p class="subtitle">Health Insurance Management System</p>
    </div>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <!-- Username Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username <span class="required-star">*</span></mat-label>
          <input
            matInput
            formControlName="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          />
          <mat-icon matPrefix class="field-icon">person</mat-icon>
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            Username is required.
          </mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password <span class="required-star">*</span></mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          />
          <mat-icon matPrefix class="field-icon">lock</mat-icon>
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hidePassword"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required.
          </mat-error>
        </mat-form-field>

        <!-- Actions -->
        <div class="action-buttons">
          <button
            type="submit"
            mat-flat-button
            color="primary"
            class="submit-btn"
            [disabled]="loginForm.invalid || isLoading"
          >
            <span *ngIf="!isLoading">Login</span>
            <span *ngIf="isLoading" class="loading-btn-content">
              <mat-spinner diameter="18" color="accent"></mat-spinner>
              <span>Authenticating...</span>
            </span>
          </button>

          <button
            type="button"
            mat-stroked-button
            color="primary"
            class="register-btn"
            (click)="goToRegister()"
            [disabled]="isLoading"
          >
            Register
          </button>
        </div>
      </form>

      <!-- Quick Role Selection / Demo Accounts -->
      <div class="demo-section">
        <div class="demo-divider">
          <span>Quick Login / Seeded Roles</span>
        </div>
        <div class="demo-chips">
          <button
            *ngFor="let acc of demoAccounts"
            type="button"
            class="demo-chip"
            (click)="fillDemo(acc)"
            title="Click to fill credentials for {{ acc.role }}"
          >
            <mat-icon class="chip-icon">key</mat-icon>
            <span>{{ acc.role }}</span>
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
