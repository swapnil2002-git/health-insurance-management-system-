spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**
        - id: product-plan-service
          uri: lb://product-plan-service
          predicates:
            - Path=/api/products/**,/api/plans/**
        - id: quotation-service
          uri: lb://quotation-service
          predicates:
            - Path=/api/quotes/**
        - id: risk-service
          uri: lb://risk-service
          predicates:
            - Path=/api/risk-assessments/**
        - id: underwriting-service
          uri: lb://underwriting-service
          predicates:
            - Path=/api/underwriting/**
        - id: policy-service
          uri: lb://policy-service
          predicates:
            - Path=/api/policies/**
        - id: premium-service
          uri: lb://premium-service
          predicates:
            - Path=/api/premium-schedules/**,/api/policies/*/premium/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: provider-service
          uri: lb://provider-service
          predicates:
            - Path=/api/providers/**,/api/provider-networks/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/